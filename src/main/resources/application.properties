spring.application.name=insurance-portal

spring.datasource.url=jdbc:mysql://localhost:3307/insurance_portal?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

app.jwt.secret=change-this-development-secret-key-32-bytes-minimum
app.jwt.expiration-ms=86400000